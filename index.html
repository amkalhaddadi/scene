<style>
/* Layout idea: a phone home screen of seven scene tiles; each opens a single reading column. */
:root{
  color-scheme:light;
  --bg:#D9EEFB; --surface:#FFFFFF; --ink:#12202B; --muted:#5B6975; --line:#BFD9EA;
  --accent:#0B5D6B; --accent-ink:#FFFFFF;
  --risk:#B3372B; --risk-bg:#FBE9E6; --opp:#1E7A4C; --opp-bg:#E3F3EA; --watch:#96690A; --watch-bg:#FAF0D7;
  --c-me:#0B5D6B; --c-af:#A6541B; --c-as:#8A2F4E; --c-ec:#2F6B2E; --c-us:#27458F; --c-eu:#5A3F8E; --c-te:#3A4A57;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.45}

/* Home */
.logo{display:block;width:190px;max-width:60%;height:auto;margin:0 auto;mix-blend-mode:multiply}
.top{display:flex;flex-direction:column;gap:2px}
.top .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.top h1{font-size:24px}
.badge{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.signals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.signals h2{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600}
.signals ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.signals li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.signals li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px;line-height:1.6}
.signals a{color:inherit;text-decoration:none}
.signals a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile:first-child{grid-column:1 / -1}
.tile .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.icon svg{width:28px;height:28px}
.tile h3{font-size:17px}
.tile p{margin:0;font-size:14px;line-height:1.65;color:var(--muted)}
.foot{color:var(--muted);font-size:13px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}

/* Scene */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.hero{display:flex;gap:14px;align-items:center}
.hero h1{font-size:22px}
.hero .sub{color:var(--muted);font-size:14px}
.lead{font-family:var(--display);font-size:18px;line-height:1.6}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{font-size:16px;display:flex;align-items:center;gap:8px}
.sec>h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--scene,var(--accent))}
.sec>h2.big{font-size:21px}
.sec>h2.big::before{height:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.devs{display:flex;flex-direction:column;gap:10px}
.dev h3{font-size:15px;font-family:var(--body);font-weight:600;line-height:1.6}
.dev p{margin:4px 0 6px;font-size:15px}
.dev .src{font-size:13px;color:var(--muted)}
.imps{display:flex;flex-direction:column;gap:10px}
.imp{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap;margin-top:3px}
.tag.risk{background:var(--risk-bg);color:var(--risk)}
.tag.opp{background:var(--opp-bg);color:var(--opp)}
.tag.watch{background:var(--watch-bg);color:var(--watch)}
.note{font-size:13px;color:var(--muted);margin:0}
.prods{display:flex;flex-direction:column;gap:8px}
.prod{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.prod b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav a{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink);font-size:14px}
.nav a small{display:block;color:var(--muted);font-size:12px}
.nav a:last-child{text-align:left}
.err{background:var(--risk-bg);color:var(--risk);border-radius:12px;padding:14px 16px}
</style>
</head>

    s.products.forEach(function(p){h+='<div class="prod"><b>'+esc(p.kind)+'</b>'+esc(p.title)+'</div>'});
    h+='</div></section>';
    h+='<nav class="nav" aria-label="التنقل بين المشاهد"><a href="#'+prev.id+'"><small>السابق</small>'+esc(prev.short)+'</a><a href="#'+next.id+'"><small>التالي</small>'+esc(next.short)+'</a></nav>';
    app.style.setProperty("--scene","var("+COLORS[s.id]+")");
    app.innerHTML=h; document.title=s.name;
  }

  function route(){
    if(!data)return;
    var id=(location.hash||"").replace("#",""), i=byId(id);
    if(i>=0)scene(i); else home();
    window.scrollTo(0,0);
  }

  window.addEventListener("hashchange",route);
  fetch("scenes.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){data=d;route()}).catch(function(){
    app.innerHTML='<p class="err">تعذّر تحميل محتوى اليوم. أعد فتح الصفحة، وتأكد من اتصالك بالإنترنت.</p>';
  });
})();
</script>
</body>
</html>
