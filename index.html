<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المشاهد">
<meta name="theme-color" content="#D9EEFB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<title>المشاهد الاستراتيجية اليومية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone home screen of seven scene tiles; each opens a single reading column. */
:root{
  color-scheme:light;
  --bg:#D9EEFB; --surface:#FFFFFF; --ink:#12202B; --muted:#5B6975; --line:#BFD9EA;
  --accent:#0B5D6B; --accent-ink:#FFFFFF;
  --risk:#B3372B; --risk-bg:#FBE9E6; --opp:#1E7A4C; --opp-bg:#E3F3EA; --watch:#96690A; --watch-bg:#FAF0D7;
  --c-me:#0B5D6B; --c-af:#A6541B; --c-as:#8A2F4E; --c-ec:#2F6B2E; --c-us:#27458F; --c-eu:#5A3F8E; --c-te:#3A4A57; --c-uae:#1D2F3F; --c-ir:#857410; --c-tasks:#2F6B2E;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.45}

/* Home */
.top{display:flex;flex-direction:column;gap:2px}
.top .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.top h1{font-size:24px}
.badge{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.signals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.signals h2{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600}
.signals ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.signals li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.signals li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px;line-height:1.6}
.signals a{color:inherit;text-decoration:none}
.signals a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile:hover{border-color:var(--muted)}
.tile:first-child{grid-column:1 / -1}
.grid .tile:last-child:nth-child(even){grid-column:1 / -1}
.tile.wide{flex-direction:row;align-items:center;gap:14px}
.tile.wide>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.icon svg{width:28px;height:28px}
.tile h3{font-size:17px}
.tile p{margin:0;font-size:14px;line-height:1.65;color:var(--muted)}
.foot{color:var(--muted);font-size:13px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}

/* Scene */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.hero{display:flex;gap:14px;align-items:center}
.hero h1{font-size:22px}
.hero .sub{color:var(--muted);font-size:14px}
.lead{font-family:var(--display);font-size:18px;line-height:1.6}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{font-size:21px;display:flex;align-items:center;gap:8px}
.sec>h2::before{content:"";width:4px;height:24px;border-radius:2px;background:var(--scene,var(--accent))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.devs{display:flex;flex-direction:column;gap:10px}
.dev h3{font-size:15px;font-family:var(--body);font-weight:600;line-height:1.6}
.dev p{margin:4px 0 6px;font-size:15px}
.dev .src{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.imps{display:flex;flex-direction:column;gap:10px}
.imp{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap;margin-top:3px}
.tag.risk{background:var(--risk-bg);color:var(--risk)}
.tag.opp{background:var(--opp-bg);color:var(--opp)}
.tag.watch{background:var(--watch-bg);color:var(--watch)}
.note{font-size:13px;color:var(--muted);margin:0}
.prods{display:flex;flex-direction:column;gap:8px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.prod b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav a{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink);font-size:14px}
.nav a small{display:block;color:var(--muted);font-size:12px}
.nav a:last-child{text-align:left}
.err{background:var(--risk-bg);color:var(--risk);border-radius:12px;padding:14px 16px}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"><p class="note">جارٍ تحميل المشاهد…</p></main>

<script>
(function(){
  var COLORS={"middle-east":"--c-me","africa":"--c-af","asia":"--c-as","economy":"--c-ec","america":"--c-us","europe":"--c-eu","technology":"--c-te","uae-image":"--c-uae","iran":"--c-ir","events":"--accent","tasks":"--c-tasks"};
  var S='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  var ICONS={
    "middle-east":'<svg viewBox="0 0 28 28" '+S+'><rect x="7" y="7" width="14" height="14"/><rect x="7" y="7" width="14" height="14" transform="rotate(45 14 14)"/><circle cx="14" cy="14" r="2.4"/></svg>',
    "africa":'<svg viewBox="0 0 28 28" '+S+'><path d="M4 20h20"/><path d="M8 20a6 6 0 0 1 12 0"/><path d="M14 8v3M6.5 11.5l2 2M21.5 11.5l-2 2M4 24h20"/></svg>',
    "asia":'<svg viewBox="0 0 28 28" '+S+'><path d="M4 11c4 0 7-2 10-6 3 4 6 6 10 6"/><path d="M6 17c3 0 5.500-1.500 8-4 2.500 2.500 5 4 8 4"/><path d="M10 11v12M18 11v12M7 23h14"/></svg>',
    "economy":'<svg viewBox="0 0 28 28" '+S+'><path d="M4 24h20"/><path d="M7 24v-6M12 24v-9M17 24v-12M22 24v-16"/><path d="M5 10l6-4 5 2 7-5"/></svg>',
    "america":'<svg viewBox="0 0 28 28" '+S+'><path d="M14 4l2.900 6.300 6.900.800-5.100 4.700 1.400 6.800L14 19.200 7.900 22.600l1.400-6.800-5.100-4.700 6.900-.800z"/></svg>',
    "europe":'<svg viewBox="0 0 28 28" fill="currentColor"><circle cx="14" cy="4.500" r="1.600"/><circle cx="20.700" cy="7.300" r="1.600"/><circle cx="23.500" cy="14" r="1.600"/><circle cx="20.700" cy="20.700" r="1.600"/><circle cx="14" cy="23.500" r="1.600"/><circle cx="7.300" cy="20.700" r="1.600"/><circle cx="4.500" cy="14" r="1.600"/><circle cx="7.300" cy="7.300" r="1.600"/></svg>',
    "technology":'<svg viewBox="0 0 28 28" '+S+'><rect x="8" y="8" width="12" height="12" rx="2"/><rect x="11.500" y="11.500" width="5" height="5"/><path d="M11 4v4M17 4v4M11 20v4M17 20v4M4 11h4M4 17h4M20 11h4M20 17h4"/></svg>'
  };
  ICONS["uae-image"]='<svg viewBox="0 0 28 28" '+S+'><path d="M5 6h15v16H7a2 2 0 0 1-2-2z"/><path d="M20 10h3v10a2 2 0 0 1-2 2"/><path d="M8.500 10h8M8.500 14h8M8.500 18h5"/></svg>';
  ICONS["iran"]='<svg viewBox="0 0 28 28" '+S+'><path d="M5 24V13c0-5 4-7 9-10 5 3 9 5 9 10v11"/><path d="M10 24v-8c0-2 2-3 4-4.500 2 1.500 4 2.500 4 4.500v8"/><path d="M3 24h22"/></svg>';
  ICONS["events"]='<svg viewBox="0 0 28 28" '+S+'><rect x="4.500" y="6.500" width="19" height="17" rx="2.500"/><path d="M4.500 11.500h19M9.500 4v5M18.500 4v5M14 14.500v6M11 17.500h6"/></svg>';
  ICONS["tasks"]='<svg viewBox="0 0 28 28" '+S+'><rect x="6" y="4.500" width="16" height="20" rx="2.500"/><path d="M11 4.500v2h6v-2"/><path d="M10 13l1.800 1.800L14.500 12M10 19l1.800 1.800L14.500 18M16.500 13.500h2M16.500 19.500h2"/></svg>';
  var MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  function fdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?(parseInt(m[3],10)+" "+MONTHS[parseInt(m[2],10)-1]+" "+m[1]):""}
  function src(d){var t=fdate(d.date);return '<div class="src"><span>المصدر: <bdi><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.source)+'</a></bdi></span>'+(t?'<bdi>'+t+'</bdi>':'')+'</div>'}
  var TAG={risk:"مخاطرة",opp:"فرصة",watch:"مراقبة"};
  var app=document.getElementById("app"), data=null;

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function icon(id){return '<span class="icon" style="background:var('+COLORS[id]+')" aria-hidden="true">'+ICONS[id]+'</span>'}
  function byId(id){for(var i=0;i<data.scenes.length;i++)if(data.scenes[i].id===id)return i;return -1}

  function home(){
    var h='<header class="top"><div class="meta"><span>'+esc(data.dateLabel)+'</span><span>'+esc(data.asOf)+'</span><span class="badge">'+esc(data.edition)+'</span></div><h1>المشاهد الاستراتيجية اليومية</h1></header>';
    h+='<section class="signals"><h2>ثلاث إشارات تستحق انتباهك اليوم</h2><ol>';
    data.signals.forEach(function(s){h+='<li><a href="#'+s.scene+'">'+esc(s.text)+'</a></li>'});
    h+='</ol></section>';
    if(data.uaeImage){var u=data.uaeImage;h+='<a class="tile wide" href="#uae-image">'+icon("uae-image")+'<div><h3>'+esc(u.name)+'</h3><p>'+esc(u.headline)+'</p></div></a>';}
    h+='<a class="tile wide" href="https://claude.ai/artifact/8oj4WWw1s1kPxwkZxVkWyy" target="_blank" rel="noopener">'+icon("events")+'<div><h3>مقترحات الفعاليات</h3><p>أدخل خبرًا أو حدثًا لصياغة مقترح ويبنار أو محاضرة أو ندوة</p></div></a>';
    h+='<a class="tile wide" href="https://claude.ai/artifact/RfpcfVL4Gt4ZKTsGQ78eAZ" target="_blank" rel="noopener">'+icon("tasks")+'<div><h3>سجل التكليفات</h3><p>حصر التكليفات: جاري العمل، تم الانتهاء، تاريخ التسليم والملاحظات</p></div></a>';
    h+='<nav class="grid" aria-label="المشاهد">';
    data.scenes.forEach(function(s){
      h+='<a class="tile" href="#'+s.id+'"><div class="row">'+icon(s.id)+'</div><h3>'+esc(s.name)+'</h3><p>'+esc(s.headline)+'</p></a>';
    });
    h+='</nav><p class="foot">الانعكاسات على المصالح الإماراتية تقدير تحليلي مبني على التطورات المنشورة، وليس خبرًا. كل تطور مرفق بمصدره داخل المشهد.</p>';
    app.innerHTML=h; document.title="المشاهد الاستراتيجية اليومية";
  }

  function scene(i){
    var s=data.scenes[i], n=data.scenes.length, prev=data.scenes[(i-1+n)%n], next=data.scenes[(i+1)%n];
    var h='<div class="bar"><a class="back" href="#home">→ كل المشاهد</a></div>';
    h+='<header class="hero">'+icon(s.id)+'<div><h1>'+esc(s.name)+'</h1><div class="sub">'+esc(data.dateLabel)+'</div></div></header>';
    h+='<p class="lead">'+esc(s.headline)+'</p><p style="margin:0">'+esc(s.summary)+'</p>';
    h+='<section class="sec"><h2>أبرز التطورات</h2><div class="devs">';
    s.developments.forEach(function(d){
      h+='<article class="card dev"><h3>'+esc(d.title)+'</h3><p>'+esc(d.text)+'</p>'+src(d)+'</article>';
    });
    h+='</div></section><section class="sec"><h2>الانعكاس على المصالح الإماراتية</h2><div class="card imps">';
    s.implications.forEach(function(m){h+='<div class="imp"><span class="tag '+m.type+'">'+TAG[m.type]+'</span><span>'+esc(m.text)+'</span></div>'});
    h+='</div><p class="note">تقدير تحليلي، لا خبر.</p></section>';
    h+='<section class="sec"><h2>منتجات مقترحة للقطاع</h2><div class="prods">';
    s.products.forEach(function(p){h+='<div class="prod"><b>'+esc(p.kind)+'</b>'+esc(p.title)+'</div>'});
    h+='</div></section>';
    h+='<nav class="nav" aria-label="التنقل بين المشاهد"><a href="#'+prev.id+'"><small>السابق</small>'+esc(prev.short)+'</a><a href="#'+next.id+'"><small>التالي</small>'+esc(next.short)+'</a></nav>';
    app.style.setProperty("--scene","var("+COLORS[s.id]+")");
    app.innerHTML=h; document.title=s.name;
  }

  function uae(){
    var u=data.uaeImage;
    var h='<div class="bar"><a class="back" href="#home">→ الرئيسية</a></div>';
    h+='<header class="hero">'+icon("uae-image")+'<div><h1>'+esc(u.name)+'</h1><div class="sub">في الصحافة العالمية · '+esc(data.dateLabel)+'</div></div></header>';
    h+='<p class="lead">'+esc(u.headline)+'</p><p style="margin:0">'+esc(u.summary)+'</p>';
    h+='<section class="sec"><h2>أبرز ما نُشر عن الإمارات</h2><div class="devs">';
    u.items.forEach(function(d){h+='<article class="card dev"><h3>'+esc(d.title)+'</h3><p>'+esc(d.text)+'</p>'+src(d)+'</article>'});
    h+='</div><p class="note">عرض لما نشرته الصحافة العالمية كما ورد فيها، إيجابيًّا كان أو نقديًّا، ولا يعبّر عن موقف.</p></section>';
    app.style.setProperty("--scene","var(--c-uae)");
    app.innerHTML=h; document.title=u.name;
  }

  function route(){
    if(!data)return;
    var id=(location.hash||"").replace("#",""), i=byId(id);
    if(id==="uae-image"&&data.uaeImage)uae(); else if(i>=0)scene(i); else home();
    window.scrollTo(0,0);
  }

  window.addEventListener("hashchange",route);
  fetch("scenes.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){data=d;route()}).catch(function(){
    app.innerHTML='<p class="err">تعذّر تحميل محتوى اليوم. أعد فتح الصفحة، وتأكد من اتصالك بالإنترنت.</p>';
  });
})();
</script>
</body>
</html>
